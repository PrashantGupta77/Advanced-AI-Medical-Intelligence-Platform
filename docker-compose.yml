services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ai-medical-backend

    ports:
      - "8000:8000"

    volumes:
      - ./outputs:/app/backend/outputs

    env_file:
      - ./backend/.env


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ai-medical-frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    environment:
      - BACKEND_URL=http://backend:8000

    volumes:
      - ./outputs:/app/outputs